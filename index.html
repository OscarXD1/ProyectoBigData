<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarma En Casa</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- TensorFlow & Teachable Machine CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
  <!-- Lucide Icons CDN (unpkg) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div class="app-container">
    <h1 class="title">Alarma En Casa</h1>

    <div id="statusPill" class="status-pill">
      <div class="status-indicator"></div>
      <span id="pillText">Micrófono inactivo</span>
    </div>

    <div id="alertCard" class="alert-card safe">
      <div id="cardHeader" class="card-header safe">
        <i id="cardIcon" data-lucide="shield-check" style="width:20px;height:20px;"></i>
        <span id="cardTitle">ÁREA SEGURA</span>
      </div>

      <div class="card-content">
        <div class="info-text">
          <span id="infoLabel" class="info-label">Estado actual:</span>
          <span id="infoValue" class="info-value">Ninguno</span>
          <span class="info-label" style="margin-top: 0.5rem;">Confianza: <span id="confidenceText1">0</span>%</span>
        </div>

        <div class="progress-circle-container">
          <svg width="70" height="70" viewBox="0 0 70 70">
            <circle class="progress-circle-bg" cx="35" cy="35" r="32" />
            <circle id="progressCircle" class="progress-circle" cx="35" cy="35" r="32" />
          </svg>
          <div class="progress-text"><span id="confidenceText2">0</span>%</div>
        </div>
      </div>

      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar" style="width: 0%"></div>
      </div>
    </div>

    <div class="buttons-container">
      <button id="toggleBtn" class="action-btn" disabled>
        <i id="toggleIcon" data-lucide="play" style="width:18px;height:18px;"></i>
        <span id="toggleText">Cargando modelo...</span>
      </button>
      <button id="historyBtn" class="action-btn">
        <i data-lucide="clipboard-list" style="width:18px;height:18px;"></i>
        <span>Historial</span>
      </button>
    </div>

    <!-- Modal Historial -->
    <div id="historyModal" class="modal-overlay">
      <div class="history-modal">
        <div class="modal-header">
          <h2 class="modal-title">
            <i data-lucide="clipboard-list" style="width:20px;height:20px;"></i>
            Historial de Alertas
          </h2>
          <button id="closeHistoryBtn" class="close-btn">
            <i data-lucide="x" style="width:24px;height:24px;"></i>
          </button>
        </div>
        <div id="historyBody" class="modal-body">
          <div class="empty-history">No hay alertas registradas aún.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
